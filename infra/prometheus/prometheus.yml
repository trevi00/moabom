global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # RESEARCH 가정 A2 = 반증 (Plan 07 실기동 실측, 2026-08-06).
  #
  # 원안: dev(호스트 JVM)와 full(컨테이너)이 같은 타깃 `host.docker.internal:8080` 하나로 커버된다(CP-8).
  # 실측: full 프로필에서 그 타깃이 DOWN 이었다 — `lastError: server returned HTTP status 404 Not Found`.
  #       404 는 "연결 거부"가 아니라 **누군가 응답했다**는 뜻이다. 응답자를 확인했더니 우리 앱이 아니었다:
  #         컨테이너 -> host.docker.internal:8080/       => 200, `Server: Apache`
  #         호스트   -> localhost:8080/                  => 404 JSON (Spring, CORS Vary 헤더)
  #       이 머신의 8080 은 무관한 httpd.exe(PID 5140)가 이미 LISTEN 중이고, Windows 소켓 의미론상
  #       Docker 가 **같은 포트에 동시 LISTEN 하는 데 성공**했다(Linux 라면 바인드 실패로 즉시 드러났을 것).
  #       결과는 출처에 따라 응답자가 갈리는 split-brain 이다.
  #
  # 그래서 타깃을 둘로 분리한다. 이 분리는 포트 충돌이 없는 머신에서도 옳다:
  #   - full 에서 `app:8080`(compose 네트워크)은 **호스트 포트 발행에 전혀 의존하지 않는다** → 결정론적이다.
  #     실측: 컨테이너 -> app:8080/actuator/prometheus => 200.
  #   - dev 에서 앱은 호스트 JVM 이므로 컨테이너 이름으로 닿을 수 없다 → host-gateway 경로가 유일하다.
  # 즉 두 모드는 애초에 다른 토폴로지이고, 타깃 하나로 둘 다 덮으려던 것이 무리였다.
  #
  # ⚠️ 의도된 성질: **어느 모드에서든 아래 둘 중 하나는 항상 DOWN 이다.** 그것이 고장이 아니라 설계다.
  #    Grafana 대시보드는 job 라벨로 구분하지 말고 두 job 을 합집합으로 질의할 것 (Phase 6 소관).
  - job_name: moabom-app-container
    # full 프로필 전용. compose 네트워크 내부 이름 — 호스트 포트와 무관하다.
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  - job_name: moabom-app-host
    # dev(`./gradlew bootRun`) 전용. compose 의 extra_hosts 가 Linux 호환을 보장한다.
    # ⚠️ 이 경로는 호스트 8080 을 다른 프로세스가 점유하면 조용히 남의 서버를 긁는다(위 실측).
    #    dev 에서 이 타깃이 UP 인데 값이 이상하면 8080 점유부터 확인할 것.
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
